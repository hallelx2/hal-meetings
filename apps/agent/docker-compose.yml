# Docker Compose for running the Hal agent on a single host.
#
# Designed for the AWS EC2 dogfood host (infra/aws, Ubuntu 24.04 t3.medium).
# Works on amd64 and arm64.
#
# Usage from the repo root:
#   docker compose -f apps/agent/docker-compose.yml up -d --build
#   docker compose -f apps/agent/docker-compose.yml logs -f hal-agent
#   docker compose -f apps/agent/docker-compose.yml down

services:
  hal-agent:
    build:
      context: ../..
      dockerfile: apps/agent/Dockerfile
    image: hal-agent:local
    container_name: hal-agent
    restart: unless-stopped

    # PID 1 is bun, which does not reap orphaned children — so every Chromium
    # that exits leaves a zombie behind. Harmless at one meeting an hour, a slow
    # march toward an exhausted process table on a host that runs for months.
    init: true

    # Long-lived worker — polls Postgres for jobs, joins meetings.
    command: ["bun", "src/cli.ts", "worker", "--concurrency", "1"]

    env_file:
      - ./.env

    volumes:
      # The bot's signed-in Chromium profile, kept outside the image.
      #
      # Google Meet refuses anonymous guests on meetings created by consumer
      # accounts — not a lobby, a flat "You can't join this video call". The
      # only way in is a signed-in Google account, and a browser profile is
      # where that session lives. Losing it on every rebuild would mean signing
      # in by hand after every deploy.
      - /opt/hal/chrome-profile:/data/chrome-profile

    # The container is self-contained (Xvfb + PulseAudio inside). It doesn't
    # listen on any port — all traffic is outbound (Neon, Gemini, Deepgram, Resend, Meet).

    # Resource ceiling. Tune per host. On a 24 GB Ampere VM these are conservative.
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 768M

    # tmpfs for whisper/audio scratch. Avoids wearing out the boot volume.
    tmpfs:
      - /tmp/hal-audio:size=512M,mode=1777
      - /var/log:size=128M,mode=1777

    # Health: the worker doesn't expose HTTP, so we check the bun process exists.
    # When you add a /healthz HTTP endpoint inside the worker, switch this to curl.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'bun.*worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # Useful for diagnosing audio routing issues.
    cap_add:
      - SYS_PTRACE

    # Docker's default seccomp profile (moby/profiles seccomp/v0.3.0) plus one
    # rule, the last entry: clone/unshare/setns without CAP_SYS_ADMIN, the user
    # namespaces Chromium's sandbox is built on. Docker's stock profile refuses
    # them, which is what pushed the bot onto --no-sandbox. Playwright publishes
    # a profile for this too, but it predates current runc and crashes runc
    # 1.5 during container init, so it is not used.
    security_opt:
      - seccomp=./docker/seccomp_profile.json

    # Logging — capped per-container. The host's docker daemon also caps via
    # /etc/docker/daemon.json (set by oracle-vm-bootstrap.sh).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
